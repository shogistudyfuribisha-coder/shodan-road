<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='shogi.js') }}"></script>
    <script src="{{ url_for('static', filename='shogi-board.js') }}"></script>
    <script src="{{ url_for('static', filename='shogi-question.js') }}"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LM9GCJ9CB6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-LM9GCJ9CB6');
    </script>

    <title>初段への道</title>
</head>

<body>

    <h1>初段への道</h1>

    <div id="category-screen">
        <h2>問題を解く</h2>

        <div id="category-buttons">
            <button onclick="startCategory('すべて')">すべて</button>
            <button onclick="startCategory('手筋')">手筋</button>
            <button onclick="startCategory('詰めろ・寄せ')">詰めろ・寄せ</button>
            <button onclick="startCategory('テスト')">テスト</button>
        </div>

        <h2>読みのトレーニング</h2>

        <div id="reading-buttons">
            <button onclick="startThreePly()">3手読み</button>
        </div>

        <h2>学習・復習</h2>

        <div id="learning-buttons">
            <button onclick="startReview()">間違えた問題を復習</button>
            <button onclick="showLearningStatus()">学習状況</button>
        </div>
    </div>
    <div id="learning-status-screen" style="display: none;">
        <h2>学習状況</h2>

        <div id="learning-summary"></div>

        <h3>苦手な問題</h3>
        <div id="weak-questions"></div>

        <button onclick="startWeakReview()">苦手問題を復習する</button>
        <button onclick="backToCategoryScreen()">カテゴリ選択に戻る</button>
    </div>
    <div id="game-screen" style="display: none;">

        <h2 id="question-number"></h2>

        <div id="gote-hand"></div>

        <div class="board-container">

            <div class="file-labels">
                <span>９</span>
                <span>８</span>
                <span>７</span>
                <span>６</span>
                <span>５</span>
                <span>４</span>
                <span>３</span>
                <span>２</span>
                <span>１</span>
            </div>

            <div class="board-with-ranks">
                <div class="board" id="board"></div>

                <div class="rank-labels">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>七</span>
                    <span>八</span>
                    <span>九</span>
                </div>
            </div>

        </div>

        <div id="sente-hand"></div>

        <p id="question"></p>

        <div id="hint-container">
            <button id="hint-button" onclick="showHint()" style="display: none;">
                ヒントを見る
            </button>
            <p id="hint-text" style="display: none;"></p>
        </div>

        <div id="choices"></div>

        <p id="result"></p>
        <p id="explanation"></p>
        <div id="question-action-buttons">
            <button id="show-answer-button" style="display: none;" onclick="showCorrectMove()">
                正解手を見る
            </button>

            <button id="retry-question-button" style="display: none;" onclick="retryCurrentQuestion()">
                この問題をもう一度解く
            </button>

            <button id="next-button" style="display: none;" onclick="nextQuestion()">
                次の問題
            </button>
        </div>
        <button id="restart-button" style="display: none;" onclick="restartGame()">
            もう一度挑戦
        </button>
        <button id="single-question-back-button" onclick="backToLearningStatus()" style="display: none;">
            学習状況に戻る
        </button>
        <div id="history" style="display: none;">
            <h3>最高記録</h3>
            <p id="best-record"></p>

            <h3>これまでの記録</h3>
            <div id="history-list"></div>
        </div>
    </div>
    <script>
        const allQuestions = {{questions | tojson }};
        const threePlyQuestions = {{three_ply_questions | tojson }};


        let questions = [];
        let currentQuestion = 0;
        let correctCount = 0;
        let questionResults = [];
        let singleQuestionMode = false;
        let currentShogiBoard = null;
        let selectedSquare = null;
        let pendingBoardMove = null;
        let selectedHandPiece = null;
        let legalMoves = [];
        let legalDrops = [];
        let correctMoveHint = null;
        let currentMoveIndex = 0;
        function startCategory(category) {
            if (category === "すべて") {
                questions = [...allQuestions];
            } else {
                questions = allQuestions.filter(
                    question => question.category === category
                );
            }

            // 問題をランダムな順番に並べる
            questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;
            questionResults = [];
            singleQuestionMode = false;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }
        function startThreePly() {
            questions = [...threePlyQuestions];

            questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;
            questionResults = [];
            singleQuestionMode = false;
            currentMoveIndex = 0;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }
        function backToLearningStatus() {
            singleQuestionMode = false;

            document.getElementById("game-screen").style.display = "none";
            showLearningStatus();
        }
        function startReview() {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadQuestionHistory") || "{}"
                );

            const reviewQuestions = allQuestions.filter(question => {
                const result = history[String(question.id)];
                return result && result.incorrect > 0;
            });

            if (reviewQuestions.length === 0) {
                alert("復習する問題はありません。");
                return;
            }

            questions = [...reviewQuestions];

            // 復習する問題もランダムな順番にする
            questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;
            questionResults = [];
            singleQuestionMode = false;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }

        function startWeakReview() {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadQuestionHistory") || "{}"
                );

            const weakQuestions = allQuestions.filter(question => {
                const result = history[String(question.id)];

                if (!result) return false;

                const total = result.correct + result.incorrect;

                if (total === 0) return false;

                const rate = result.correct / total * 100;

                return rate < 70;
            });

            if (weakQuestions.length === 0) {
                alert("現在、苦手な問題はありません。");
                return;
            }

            questions = [...weakQuestions];

            // 苦手問題もランダムな順番にする
            questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;
            questionResults = [];
            singleQuestionMode = false;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("learning-status-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }

        function startSingleQuestion(questionId) {
            const question = allQuestions.find(
                question => String(question.id) === String(questionId)
            );

            if (!question) {
                alert("問題が見つかりません。");
                return;
            }

            questions = [question];

            currentQuestion = 0;
            correctCount = 0;
            questionResults = [];
            singleQuestionMode = true;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("learning-status-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }

        function showLearningStatus() {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadQuestionHistory") || "{}"
                );

            const historyEntries = Object.entries(history);

            if (historyEntries.length === 0) {
                document.getElementById("learning-summary").innerHTML =
                    "<p>まだ学習履歴がありません。</p>";

                document.getElementById("weak-questions").innerHTML = "";

                document.getElementById("category-screen").style.display = "none";
                document.getElementById("learning-status-screen").style.display = "block";

                return;
            }

            let totalCorrect = 0;
            let totalIncorrect = 0;

            const questionStats = [];

            historyEntries.forEach(([id, result]) => {
                const total = result.correct + result.incorrect;

                if (total === 0) return;

                totalCorrect += result.correct;
                totalIncorrect += result.incorrect;

                const rate = Math.round(result.correct / total * 100);

                const question = allQuestions.find(
                    question => String(question.id) === id
                );

                questionStats.push({
                    id,
                    question,
                    correct: result.correct,
                    incorrect: result.incorrect,
                    total,
                    rate
                });
            });

            const totalAnswers = totalCorrect + totalIncorrect;
            const overallRate =
                totalAnswers > 0
                    ? Math.round(totalCorrect / totalAnswers * 100)
                    : 0;

            const studiedCount = questionStats.length;

            document.getElementById("learning-summary").innerHTML = `
                <p>学習済み：${studiedCount}問 / ${allQuestions.length}問</p>
                <p>総回答数：${totalAnswers}回</p>
                <p>正解数：${totalCorrect}回</p>
                <p>正答率：${overallRate}%</p>
            `;

            // 正答率が低い順に並べる
            questionStats.sort((a, b) => a.rate - b.rate);

            const weakQuestions = questionStats.filter(
                stat => stat.rate < 70
            );

            if (weakQuestions.length === 0) {
                document.getElementById("weak-questions").innerHTML =
                    "<p>現在、特に苦手な問題はありません！</p>";
            } else {
                document.getElementById("weak-questions").innerHTML =
                    weakQuestions.map(stat => {
                        const questionText =
                            stat.question
                                ? stat.question.question
                                : `問題ID：${stat.id}`;

                        return `
                            <div class="weak-question">
                                <p>
                                    <strong>問題${stat.id}</strong>
                                    正答率：${stat.rate}%
                                </p>
                                <p>${questionText}</p>
                                <p>
                                    正解：${stat.correct}回 /
                                    不正解：${stat.incorrect}回
                                </p>
                                <button onclick="startSingleQuestion(${stat.id})">
                                    この問題を見る
                                </button>
                            </div>
                        `;
                    }).join("");
            }

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("learning-status-screen").style.display = "block";
        }

        function backToCategoryScreen() {
            document.getElementById("learning-status-screen").style.display = "none";
            document.getElementById("category-screen").style.display = "block";
        }
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");

        if (category === "手筋" || category === "詰めろ・寄せ" || category === "すべて") {
            startCategory(category);
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            const isThreePly = question.type === "3ply";

            if (isThreePly) {
                currentMoveIndex = 0;
            }
            document.getElementById("show-answer-button").style.display = "none";
            document.getElementById("show-answer-button").disabled = false;
            document.getElementById("retry-question-button").style.display = "none";

            // ヒントをリセット
            document.getElementById("hint-button").style.display = "none";
            document.getElementById("hint-text").style.display = "none";
            document.getElementById("hint-text").textContent = "";

            // ヒントがある問題だけ「ヒントを見る」を表示
            if (question.hint) {
                document.getElementById("hint-button").style.display = "block";
            }

            currentShogiBoard =
                shogiBoard.createShogiBoard(question, ShogiJS);

            selectedSquare = null;
            pendingBoardMove = null;
            selectedHandPiece = null;
            legalMoves = [];
            legalDrops = [];
            correctMoveHint = null;

            document.getElementById("question-number").textContent =
                `第${currentQuestion + 1}問 / 全${questions.length}問`;

            showBoardFromShogi();
            showHandsFromShogi();

            document.getElementById("question").textContent =
                question.question;

            if (question.type !== "3ply") {
                showChoices(question);
            } else {
                document.getElementById("choices").innerHTML = "";
            }
            document.getElementById("result").textContent = "";
            document.getElementById("explanation").textContent = "";
            document.getElementById("next-button").style.display = "none";
            document.getElementById("restart-button").style.display = "none";
            document.getElementById("single-question-back-button").style.display =
                "none";
        }

        function showHint() {
            const question = questions[currentQuestion];

            document.getElementById("hint-text").textContent =
                question.hint;

            document.getElementById("hint-text").style.display =
                "block";

            document.getElementById("hint-button").style.display =
                "none";
        }

        function showChoices(question) {
            const choicesElement =
                document.getElementById("choices");

            choicesElement.innerHTML = "";

            question.choices.forEach((choice, index) => {
                const button =
                    document.createElement("button");

                button.textContent = choice;

                button.onclick = function () {
                    checkAnswer(index);
                };

                choicesElement.appendChild(button);
            });
        }
        function showHandsFromShogi() {
            const senteHand =
                currentShogiBoard.hands[ShogiJS.Color.Black];

            const goteHand =
                currentShogiBoard.hands[ShogiJS.Color.White];

            const senteHandElement =
                document.getElementById("sente-hand");

            const goteHandElement =
                document.getElementById("gote-hand");

            senteHandElement.innerHTML = "";
            goteHandElement.innerHTML = "";

            const senteLabel =
                document.createElement("span");

            senteLabel.textContent = "先手の持ち駒：";

            senteHandElement.appendChild(senteLabel);

            renderHandPieces(
                senteHand,
                ShogiJS.Color.Black,
                senteHandElement
            );

            const goteLabel =
                document.createElement("span");

            goteLabel.textContent = "後手の持ち駒：";

            goteHandElement.appendChild(goteLabel);

            renderHandPieces(
                goteHand,
                ShogiJS.Color.White,
                goteHandElement
            );
        }

        function renderHandPieces(hand, color, container) {
            if (hand.length === 0) {
                const empty =
                    document.createElement("span");

                empty.textContent = "なし";

                container.appendChild(empty);

                return;
            }

            const pieceCounts = {};

            hand.forEach(piece => {
                pieceCounts[piece.kind] =
                    (pieceCounts[piece.kind] || 0) + 1;
            });

            Object.entries(pieceCounts).forEach(
                ([kind, count]) => {
                    const button =
                        document.createElement("button");

                    const pieceName =
                        shogiBoard.PIECE_NAME_MAP[kind];

                    button.textContent =
                        count > 1
                            ? `${pieceName}×${count}`
                            : pieceName;

                    if (
                        selectedHandPiece !== null &&
                        selectedHandPiece.kind === kind &&
                        selectedHandPiece.color === color
                    ) {
                        button.classList.add("selected-hand");
                    }

                    // 不正解時の正解手が持ち駒からの打ちの場合、
                    // 正解に使う持ち駒を強調表示する
                    if (
                        correctMoveHint &&
                        correctMoveHint.from_hand &&
                        correctMoveHint.piece
                    ) {
                        const correctPiece =
                            correctMoveHint.piece;

                        const correctColor =
                            correctPiece.startsWith("S")
                                ? ShogiJS.Color.Black
                                : ShogiJS.Color.White;

                        const correctKind =
                            Object.entries(
                                shogiBoard.PIECE_NAME_MAP
                            ).find(
                                ([key, value]) =>
                                    `S${value}` === correctPiece ||
                                    `G${value}` === correctPiece
                            )?.[0];

                        if (
                            correctKind === kind &&
                            correctColor === color
                        ) {
                            button.classList.add("correct-hand");
                        }
                    }

                    button.onclick = function () {
                        selectHandPiece(kind, color);
                    };

                    container.appendChild(button);
                }
            );
        }

        function showBoardFromShogi() {
            const boardElement =
                document.getElementById("board");

            boardElement.innerHTML = "";

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {

                    const {x, y} =
                        shogiBoard.questionBoardToShogi(row, col);

                    const piece =
                        currentShogiBoard.get(x, y);

                    const square =
                        document.createElement("div");

                    square.className = "square";
                    if (
                        selectedSquare &&
                        selectedSquare.x === x &&
                        selectedSquare.y === y
                    ) {
                        square.classList.add("selected");
                    }

                    const isLegalDestination = legalMoves.some(move => {
                        return move.to.x === x && move.to.y === y;
                    });

                    if (isLegalDestination) {
                        square.classList.add("legal-move");
                    }
                    const isLegalDropDestination = legalDrops.some(drop => {
                        return drop.to.x === x && drop.to.y === y;
                    });

                    if (isLegalDropDestination) {
                        square.classList.add("legal-move");
                    }
                    if (correctMoveHint) {
                        // 通常の指し手
                        if (!correctMoveHint.from_hand) {
                            if (
                                correctMoveHint.from[0] === x &&
                                correctMoveHint.from[1] === y
                            ) {
                                square.classList.add("correct-move-from");
                            }

                            if (
                                correctMoveHint.to[0] === x &&
                                correctMoveHint.to[1] === y
                            ) {
                                square.classList.add("correct-move-to");
                            }
                        }
                        // 持ち駒を打つ手
                        else {
                            if (
                                correctMoveHint.to[0] === x &&
                                correctMoveHint.to[1] === y
                            ) {
                                square.classList.add("correct-move-to");
                            }
                        }
                    }
                    square.onclick = function () {
                        selectSquare(x, y);
                    };

                    if (piece !== null) {
                        const owner =
                            piece.color === ShogiJS.Color.Black
                                ? "S"
                                : "G";

                        const pieceName =
                            shogiBoard.PIECE_NAME_MAP[piece.kind];

                        if (!pieceName) {
                            throw new Error(
                                `未対応の駒: ${piece.kind}`
                            );
                        }

                        const pieceElement =
                            document.createElement("span");

                        pieceElement.textContent =
                            pieceName;

                        if (pieceName.length >= 2) {
                            pieceElement.classList.add("long-piece");
                        }

                        if (owner === "G") {
                            pieceElement.classList.add("gote");
                        }

                        square.appendChild(pieceElement);
                    }

                    boardElement.appendChild(square);
                }
            }
        }

        function selectHandPiece(kind, color) {
            // 問題回答済みなら何もしない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            // 成り選択待ちの場合は持ち駒を操作しない
            if (pendingBoardMove !== null) {
                return;
            }

            // 自分の手番ではない持ち駒は選択できない
            if (currentShogiBoard.turn !== color) {
                return;
            }

            // 盤上の駒を選択していたら解除
            selectedSquare = null;
            legalMoves = [];

            selectedHandPiece = {
                kind,
                color
            };
            legalDrops = shogiQuestion.getLegalDrops(
                currentShogiBoard,
                color
            );
            console.log(
                "持ち駒を選択:",
                selectedHandPiece
            );

            showHandsFromShogi();
            showBoardFromShogi();
        }
        function executeBoardDrop(handPiece, to) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            if (
                !legalDrops.some(drop => {
                    return (
                        drop.kind === handPiece.kind &&
                        drop.color === handPiece.color &&
                        drop.to.x === to.x &&
                        drop.to.y === to.y
                    );
                })
            ) {
                console.log("不合法な打ち場所です");
                return;
            }

            try {
                currentShogiBoard.drop(
                    to.x,
                    to.y,
                    handPiece.kind,
                    handPiece.color
                );

                const userMove = {
                    from_hand: true,
                    piece:
                        handPiece.color === ShogiJS.Color.Black
                            ? `S${shogiBoard.PIECE_NAME_MAP[handPiece.kind]}`
                            : `G${shogiBoard.PIECE_NAME_MAP[handPiece.kind]}`,
                    to
                };

                console.log(
                    "ユーザーの着手:",
                    userMove
                );

                const question = questions[currentQuestion];

                const correctMove = question.type === "3ply"
                    ? question.moves[currentMoveIndex]
                    : question.move;

                const isCorrect =
                    shogiQuestion.isCorrectMove(
                        userMove,
                        correctMove
                    );

                console.log("正解:", isCorrect);

                selectedHandPiece = null;
                legalDrops = [];

                handleBoardAnswer(
                    questions[currentQuestion],
                    isCorrect
                );

                showBoardFromShogi();
                showHandsFromShogi();

            } catch (error) {
                console.log(
                    "駒を打てません:",
                    error
                );
            }
        }
        function selectSquare(x, y) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }
            // 成り選択待ちの場合は盤面を操作しない
            if (pendingBoardMove !== null) {
                return;
            }

            // 持ち駒を選択している場合
            if (selectedHandPiece !== null) {
                const clickedPiece = currentShogiBoard.get(x, y);

                // 自分の駒をクリックした場合は、
                // 持ち駒の選択を解除して、その駒を新しく選択する
                if (
                    clickedPiece &&
                    clickedPiece.color === currentShogiBoard.turn
                ) {
                    selectedHandPiece = null;
                    legalDrops = [];

                    selectedSquare = {x, y};

                    legalMoves = shogiQuestion.getLegalMovesFrom(
                        currentShogiBoard,
                        selectedSquare
                    );

                    showHandsFromShogi();
                    showBoardFromShogi();

                    return;
                }

                // それ以外は持ち駒を打つ操作
                const to = {
                    x,
                    y
                };

                executeBoardDrop(
                    selectedHandPiece,
                    to
                );

                return;
            }

            const piece = currentShogiBoard.get(x, y);

            if (!selectedSquare) {
                if (
                    !shogiQuestion.canSelectPiece(
                        piece,
                        currentShogiBoard.turn,
                        ShogiJS
                    )
                ) {
                    return;
                }

                selectedSquare = {x, y};

                legalDrops = [];

                legalMoves = shogiQuestion.getLegalMovesFrom(
                    currentShogiBoard,
                    selectedSquare
                );

                showBoardFromShogi();
                return;
            }
            if (
                piece &&
                piece.color === currentShogiBoard.turn
            ) {
                selectedSquare = {x, y};

                legalMoves = [];

                legalMoves = shogiQuestion.getLegalMovesFrom(
                    currentShogiBoard,
                    selectedSquare
                );

                showBoardFromShogi();
                return;
            }
            if (selectedSquare.x === x && selectedSquare.y === y) {
                selectedSquare = null;
                legalMoves = [];

                showBoardFromShogi();
                return;
            }

            const from = {
                x: selectedSquare.x,
                y: selectedSquare.y
            };

            const to = {
                x,
                y
            };

            const isLegalDestination = legalMoves.some(move => {
                return move.to.x === x && move.to.y === y;
            });

            if (!isLegalDestination) {
                return;
            }

            if (
                shogiQuestion.isSuicideMove(currentShogiBoard, from, to, false) &&
                shogiQuestion.isSuicideMove(currentShogiBoard, from, to, true)
            ) {
                console.log("王を取られる手（自殺手）は指せません");
                selectedSquare = null;
                showBoardFromShogi();
                return;
            }

            const mustPromote =
                shogiQuestion.mustPromote(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    ShogiJS,
                    currentShogiBoard
                );

            const canPromote =
                shogiQuestion.canPromote(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    ShogiJS,
                    currentShogiBoard
                );

            if (mustPromote || canPromote) {
                pendingBoardMove = {
                    from,
                    to
                };

                selectedSquare = null;

                showPromotionChoice(mustPromote);

                return;
            }

            executeBoardMove(from, to, false);
        }

        function executeBoardMove(from, to, promote) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            if (
                shogiQuestion.isSuicideMove(
                    currentShogiBoard,
                    from,
                    to,
                    promote
                )
            ) {
                console.log("王を取られる手（自殺手）は指せません");
                pendingBoardMove = null;
                selectedSquare = null;
                legalMoves = [];
                showBoardFromShogi();
                return;
            }

            try {
                currentShogiBoard.move(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    promote
                );

                const userMove = {
                    from,
                    to,
                    promote
                };

                console.log(
                    "ユーザーの着手:",
                    userMove
                );

                const question = questions[currentQuestion];

                const correctMove = question.type === "3ply"
                    ? question.moves[currentMoveIndex]
                    : question.move;

                const isCorrect =
                    shogiQuestion.isCorrectMove(
                        userMove,
                        correctMove
                    );

                console.log("正解:", isCorrect);

                pendingBoardMove = null;
                selectedSquare = null;
                legalMoves = [];

                handleBoardAnswer(
                    questions[currentQuestion],
                    isCorrect
                );

                showBoardFromShogi();
                showHandsFromShogi();

            } catch (error) {
                console.log("駒を移動できません:", error);

                pendingBoardMove = null;
                selectedSquare = null;

                showBoardFromShogi();
            }
        }

        function showPromotionChoice(mustPromote) {
            const choicesElement =
                document.getElementById("choices");

            choicesElement.innerHTML = "";

            const promoteButton =
                document.createElement("button");

            promoteButton.textContent = "成る";

            promoteButton.onclick = function () {
                const move = pendingBoardMove;

                choicesElement.innerHTML = "";

                executeBoardMove(
                    move.from,
                    move.to,
                    true
                );
            };

            choicesElement.appendChild(promoteButton);

            if (mustPromote) {
                return;
            }

            const noPromoteButton =
                document.createElement("button");

            noPromoteButton.textContent = "成らない";

            noPromoteButton.onclick = function () {
                const move = pendingBoardMove;

                choicesElement.innerHTML = "";

                executeBoardMove(
                    move.from,
                    move.to,
                    false
                );
            };

            choicesElement.appendChild(noPromoteButton);
        }

        function checkAnswer(choice) {
            const question = questions[currentQuestion];

            // すでに回答済みなら何もしない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            const buttons =
                document.querySelectorAll("#choices button");

            if (choice === question.answer) {
                handleCorrectAnswer(question, buttons, choice);
            } else {
                handleIncorrectAnswer(question, buttons, choice);
            }

            finishQuestion(question, buttons);
        }

        function handleCorrectAnswer(question, buttons, choice) {
            correctCount++;

            questionResults.push({
                id: question.id,
                correct: true
            });

            buttons[choice].classList.add("correct");

            shogiBoard.executeCorrectMove(
                currentShogiBoard,
                question.move,
                ShogiJS
            );

            const isMate = shogiQuestion.isCheckmate(currentShogiBoard);
            document.getElementById("result").textContent =
                isMate ? "正解！（詰み）" : "正解！";

            showBoardFromShogi();
            showHandsFromShogi();
        }
        function handleIncorrectAnswer(question, buttons, choice) {
            document.getElementById("result").textContent = "不正解！";
            buttons[choice].classList.add("incorrect");
            buttons[question.answer].classList.add("correct");

            questionResults.push({
                id: question.id,
                correct: false
            });

            correctMoveHint = question.move;

            showBoardFromShogi();
            showHandsFromShogi();
        }
        function finishQuestion(question, buttons) {
            document.getElementById("explanation").textContent =
                question.explanation;

            buttons.forEach(button => {
                button.disabled = true;
            });

            // 不正解の場合だけ「正解手を見る」を表示
            if (
                document.getElementById("result").textContent ===
                "不正解！"
            ) {
                document.getElementById("show-answer-button").style.display =
                    "block";

                document.getElementById("retry-question-button").style.display =
                    "block";
            }

            // 個別確認モードでは、この1問で終了
            if (singleQuestionMode) {
                document.getElementById("next-button").style.display =
                    "none";

                document.getElementById("single-question-back-button").style.display =
                    "block";

                return;
            }

            // 通常モードでは次の問題へ
            document.getElementById("next-button").style.display =
                "block";
        }
        function handleBoardAnswer(question, isCorrect) {
            const buttons =
                document.querySelectorAll("#choices button");

            // 3手読み問題
            if (question.type === "3ply") {

                // 不正解
                if (!isCorrect) {
                    document.getElementById("result").textContent =
                        "不正解！";

                    questionResults.push({
                        id: question.id,
                        correct: false
                    });

                    correctMoveHint = question.moves[currentMoveIndex];

                    finishQuestion(question, buttons);

                    showBoardFromShogi();
                    showHandsFromShogi();

                    return;
                }

                // 1手目正解
                if (currentMoveIndex === 0) {
                    currentMoveIndex = 1;

                    executeThreePlyOpponentMove(question);

                    currentMoveIndex = 2;

                    selectedSquare = null;
                    selectedHandPiece = null;
                    pendingBoardMove = null;
                    legalMoves = [];
                    legalDrops = [];

                    showBoardFromShogi();
                    showHandsFromShogi();

                    return;
                }

                // 3手目正解
                if (currentMoveIndex === 2) {
                    document.getElementById("result").textContent =
                        "正解！";

                    correctCount++;

                    questionResults.push({
                        id: question.id,
                        correct: true
                    });

                    finishQuestion(question, buttons);

                    showBoardFromShogi();
                    showHandsFromShogi();

                    return;
                }
            }

            // 通常の1手問題
            selectedSquare = null;
            selectedHandPiece = null;
            pendingBoardMove = null;
            legalMoves = [];
            legalDrops = [];

            if (isCorrect) {
                const isMate = shogiQuestion.isCheckmate(
                    currentShogiBoard
                );

                document.getElementById("result").textContent =
                    isMate ? "正解！（詰み）" : "正解！";

                correctCount++;

                questionResults.push({
                    id: question.id,
                    correct: true
                });
            } else {
                document.getElementById("result").textContent =
                    "不正解！";

                questionResults.push({
                    id: question.id,
                    correct: false
                });

                currentShogiBoard = shogiBoard.createShogiBoard(
                    question,
                    ShogiJS
                );

                correctMoveHint = question.move;
            }

            finishQuestion(question, buttons);

            showBoardFromShogi();
            showHandsFromShogi();
        }
        function executeThreePlyOpponentMove(question) {
            const move = question.moves[1];

            try {
                if (move.from_hand) {
                    const owner = move.piece.charAt(0);

                    const color =
                        owner === "S"
                            ? ShogiJS.Color.Black
                            : ShogiJS.Color.White;

                    const pieceName = move.piece.substring(1);

                    const pieceKind =
                        Object.entries(
                            shogiBoard.PIECE_NAME_MAP
                        ).find(([, name]) => name === pieceName);

                    if (!pieceKind) {
                        throw new Error(
                            `持ち駒の種類を特定できません: ${pieceName}`
                        );
                    }

                    currentShogiBoard.drop(
                        move.to[0],
                        move.to[1],
                        Number(pieceKind[0]),
                        color
                    );

                } else {
                    currentShogiBoard.move(
                        move.from[0],
                        move.from[1],
                        move.to[0],
                        move.to[1],
                        move.promote || false
                    );
                }

                console.log(
                    "相手の自動着手:",
                    move
                );

            } catch (error) {
                console.error(
                    "相手の自動着手に失敗しました:",
                    error
                );
            }
        }

        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        function saveHistory(rate) {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadHistory") || "[]"
                );

            history.push({
                date: new Date().toLocaleString("ja-JP"),
                correct: correctCount,
                total: questions.length,
                rate: rate
            });

            localStorage.setItem(
                "shodanRoadHistory",
                JSON.stringify(history)
            );

            return history;
        }
        function saveQuestionHistory() {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadQuestionHistory") || "{}"
                );

            questionResults.forEach(result => {
                const id = String(result.id);

                if (!history[id]) {
                    history[id] = {
                        correct: 0,
                        incorrect: 0
                    };
                }

                if (result.correct) {
                    history[id].correct++;
                } else {
                    history[id].incorrect++;
                }
            });

            localStorage.setItem(
                "shodanRoadQuestionHistory",
                JSON.stringify(history)
            );

            return history;
        }
        function showBestRecord(history) {
            const bestRecord = history.reduce((best, record) => {
                return record.rate > best.rate ? record : best;
            });

            document.getElementById("best-record").textContent =
                `${bestRecord.correct} / ${bestRecord.total}問　${bestRecord.rate}%`;
        }
        function showHistory(history) {
            const historyList =
                document.getElementById("history-list");

            historyList.innerHTML = "";

            history.slice().reverse().forEach(record => {
                const p = document.createElement("p");

                p.textContent =
                    `${record.date}　${record.correct} / ${record.total}問　${record.rate}%`;

                historyList.appendChild(p);
            });

            document.getElementById("history").style.display =
                "block";
        }
        function showResult() {
            document.getElementById("question-number").textContent =
                "結果";

            // 問題回答中のボタンを非表示
            document.getElementById("show-answer-button").style.display =
                "none";
            document.getElementById("retry-question-button").style.display =
                "none";
            document.getElementById("next-button").style.display =
                "none";
            document.getElementById("restart-button").style.display =
                "block";
            document.getElementById("single-question-back-button").style.display =
                "none";

            document.getElementById("question").textContent =
                `${questions.length}問中${correctCount}問正解！`;

            document.getElementById("choices").innerHTML = "";

            const rate =
                Math.round(correctCount / questions.length * 100);

            document.getElementById("result").textContent =
                `正答率：${rate}%`;

            document.getElementById("explanation").textContent = "";

            const history = saveHistory(rate);
            saveQuestionHistory();

            showBestRecord(history);

            // 履歴を表示
            showHistory(history);
        }
        function restartGame() {

            // 問題データを最初の状態に戻すためにページを再読み込み
            location.reload();
        }
        function showCorrectMove() {
            const question = questions[currentQuestion];

            if (!question) return;

            // 3手読み問題
            if (question.type === "3ply") {
                currentShogiBoard = shogiBoard.createShogiBoard(
                    question,
                    ShogiJS
                );

                try {
                    question.moves.forEach(move => {
                        if (move.from_hand) {
                            const color =
                                move.piece.startsWith("S")
                                    ? ShogiJS.Color.Black
                                    : ShogiJS.Color.White;

                            const kind =
                                Object.entries(
                                    shogiBoard.PIECE_NAME_MAP
                                ).find(([key, value]) => {
                                    return (
                                        `S${value}` === move.piece ||
                                        `G${value}` === move.piece
                                    );
                                })?.[0];

                            if (!kind) {
                                throw new Error(
                                    `持ち駒の種類を特定できません: ${move.piece}`
                                );
                            }

                            currentShogiBoard.drop(
                                move.to[0],
                                move.to[1],
                                kind,
                                color
                            );

                        } else {
                            currentShogiBoard.move(
                                move.from[0],
                                move.from[1],
                                move.to[0],
                                move.to[1],
                                move.promote || false
                            );
                        }
                    });

                    // 正解手のハイライトを解除
                    correctMoveHint = null;

                    // 選択状態を解除
                    selectedSquare = null;
                    selectedHandPiece = null;
                    pendingBoardMove = null;
                    legalMoves = [];
                    legalDrops = [];

                    currentMoveIndex = 2;

                    showBoardFromShogi();
                    showHandsFromShogi();

                    // ボタンを無効化
                    document.getElementById("show-answer-button").disabled =
                        true;

                } catch (error) {
                    console.error(
                        "3手の正解手を再生できません:",
                        error
                    );
                }

                return;
            }

            // 通常の1手問題
            if (!question.move) return;

            // 問題開始時の盤面に戻す
            currentShogiBoard = shogiBoard.createShogiBoard(
                question,
                ShogiJS
            );

            const move = question.move;

            try {
                if (move.from_hand) {
                    const color =
                        move.piece.startsWith("S")
                            ? ShogiJS.Color.Black
                            : ShogiJS.Color.White;

                    const kind =
                        Object.entries(
                            shogiBoard.PIECE_NAME_MAP
                        ).find(([key, value]) => {
                            return (
                                `S${value}` === move.piece ||
                                `G${value}` === move.piece
                            );
                        })?.[0];

                    if (!kind) return;

                    currentShogiBoard.drop(
                        move.to[0],
                        move.to[1],
                        kind,
                        color
                    );
                } else {
                    currentShogiBoard.move(
                        move.from[0],
                        move.from[1],
                        move.to[0],
                        move.to[1],
                        move.promote || false
                    );
                }

                // 正解手のハイライトを解除
                correctMoveHint = null;

                // 選択状態を解除
                selectedSquare = null;
                selectedHandPiece = null;
                pendingBoardMove = null;
                legalMoves = [];
                legalDrops = [];

                showBoardFromShogi();
                showHandsFromShogi();

                // ボタンを無効化
                document.getElementById("show-answer-button").disabled =
                    true;

            } catch (error) {
                console.error("正解手を再生できません:", error);
            }
        }
        function retryCurrentQuestion() {
            // 現在の問題を最初の状態で再表示
            showQuestion();
        }
    </script>
