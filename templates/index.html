<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='shogi.js') }}"></script>
    <script src="{{ url_for('static', filename='shogi-board.js') }}"></script>
    <script src="{{ url_for('static', filename='shogi-question.js') }}"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LM9GCJ9CB6"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-LM9GCJ9CB6');
    </script>

    <title>初段への道</title>
</head>
<body>

    <h1>初段への道</h1>

    <div id="category-screen">
        <h2>カテゴリを選択</h2>

        <div id="category-buttons">
            <button onclick="startCategory('すべて')">すべて</button>
            <button onclick="startCategory('手筋')">手筋</button>
            <button onclick="startCategory('詰めろ・寄せ')">詰めろ・寄せ</button>
            <button onclick="startCategory('テスト')">テスト</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">

        <h2 id="question-number"></h2>

        <div id="gote-hand"></div>

        <div class="board-container">

            <div class="file-labels">
                <span>９</span>
                <span>８</span>
                <span>７</span>
                <span>６</span>
                <span>５</span>
                <span>４</span>
                <span>３</span>
                <span>２</span>
                <span>１</span>
            </div>

            <div class="board-with-ranks">
                <div class="board" id="board"></div>

                <div class="rank-labels">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>七</span>
                    <span>八</span>
                    <span>九</span>
                </div>
            </div>

        </div>

        <div id="sente-hand"></div>

        <p id="question"></p>

        <div id="choices"></div>

        <p id="result"></p>
        <p id="explanation"></p>

        <button id="next-button" style="display: none;" onclick="nextQuestion()">
            次の問題
        </button>
        <button id="restart-button" style="display: none;" onclick="restartGame()">
            もう一度挑戦
        </button>
        <div id="history" style="display: none;">
            <h3>最高記録</h3>
            <p id="best-record"></p>

            <h3>これまでの記録</h3>
            <div id="history-list"></div>
        </div>
    </div>
    <script>
        const allQuestions = {{ questions | tojson }};


        let questions = [];
        let currentQuestion = 0;
        let correctCount = 0;
        let currentShogiBoard = null;
        let selectedSquare = null;
        let pendingBoardMove = null;
        let selectedHandPiece = null;
        let legalMoves = [];
        function startCategory(category) {
            if (category === "すべて") {
                questions = [...allQuestions];
            } else {
                questions = allQuestions.filter(
                    question => question.category === category
                );
            }

            // 問題をランダムな順番に並べる
            questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }

        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");

        if (category === "手筋" || category === "詰めろ・寄せ" || category === "すべて") {
            startCategory(category);
        }

        function showQuestion() {
            const question = questions[currentQuestion];

            currentShogiBoard =
                shogiBoard.createShogiBoard(question, ShogiJS);

            selectedSquare = null;
            pendingBoardMove = null;
            selectedHandPiece = null;
            legalMoves = [];
            legalDrops = [];

            document.getElementById("question-number").textContent =
                `第${currentQuestion + 1}問 / 全${questions.length}問`;

            showBoardFromShogi();
            showHandsFromShogi();

            document.getElementById("question").textContent =
                question.question;

            showChoices(question);

            document.getElementById("result").textContent = "";
            document.getElementById("explanation").textContent = "";
            document.getElementById("next-button").style.display = "none";
            document.getElementById("restart-button").style.display = "none";
        }

        function showChoices(question) {
            const choicesElement =
                document.getElementById("choices");

            choicesElement.innerHTML = "";

            question.choices.forEach((choice, index) => {
                const button =
                    document.createElement("button");

                button.textContent = choice;

                button.onclick = function() {
                    checkAnswer(index);
                };

                choicesElement.appendChild(button);
            });
        }
        function showHandsFromShogi() {
            const senteHand =
                currentShogiBoard.hands[ShogiJS.Color.Black];

            const goteHand =
                currentShogiBoard.hands[ShogiJS.Color.White];

            const senteHandElement =
                document.getElementById("sente-hand");

            const goteHandElement =
                document.getElementById("gote-hand");

            senteHandElement.innerHTML = "";
            goteHandElement.innerHTML = "";

            const senteLabel =
                document.createElement("span");

            senteLabel.textContent = "先手の持ち駒：";

            senteHandElement.appendChild(senteLabel);

            renderHandPieces(
                senteHand,
                ShogiJS.Color.Black,
                senteHandElement
            );

            const goteLabel =
                document.createElement("span");

            goteLabel.textContent = "後手の持ち駒：";

            goteHandElement.appendChild(goteLabel);

            renderHandPieces(
                goteHand,
                ShogiJS.Color.White,
                goteHandElement
            );
        }

        function renderHandPieces(hand, color, container) {
            if (hand.length === 0) {
                const empty =
                    document.createElement("span");

                empty.textContent = "なし";

                container.appendChild(empty);

                return;
            }

            const pieceCounts = {};

            hand.forEach(piece => {
                pieceCounts[piece.kind] =
                    (pieceCounts[piece.kind] || 0) + 1;
            });

            Object.entries(pieceCounts).forEach(
                ([kind, count]) => {
                    const button =
                        document.createElement("button");

                    const pieceName =
                        shogiBoard.PIECE_NAME_MAP[kind];

                    button.textContent =
                        count > 1
                            ? `${pieceName}×${count}`
                            : pieceName;

                    if (
                        selectedHandPiece !== null &&
                        selectedHandPiece.kind === kind &&
                        selectedHandPiece.color === color
                    ) {
                        button.classList.add("selected-hand");
                    }

                    button.onclick = function() {
                        selectHandPiece(kind, color);
                    };

                    container.appendChild(button);
                }
            );
        }

        function showBoardFromShogi() {
            const boardElement =
                document.getElementById("board");

            boardElement.innerHTML = "";

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {

                    const { x, y } =
                        shogiBoard.questionBoardToShogi(row, col);

                    const piece =
                        currentShogiBoard.get(x, y);

                    const square =
                        document.createElement("div");

                    square.className = "square";
                    if (
                        selectedSquare &&
                        selectedSquare.x === x &&
                        selectedSquare.y === y
                    ) {
                        square.classList.add("selected");
                    }

                    const isLegalDestination = legalMoves.some(move => {
                        return move.to.x === x && move.to.y === y;
                    });

                    if (isLegalDestination) {
                        square.classList.add("legal-move");
                    }
                    const isLegalDropDestination = legalDrops.some(drop => {
                        return drop.to.x === x && drop.to.y === y;
                    });

                    if (isLegalDropDestination) {
                        square.classList.add("legal-move");
                    }
                    square.onclick = function() {
                        selectSquare(x, y);
                    };

                    if (piece !== null) {
                        const owner =
                            piece.color === ShogiJS.Color.Black
                                ? "S"
                                : "G";

                        const pieceName =
                            shogiBoard.PIECE_NAME_MAP[piece.kind];

                        if (!pieceName) {
                            throw new Error(
                                `未対応の駒: ${piece.kind}`
                            );
                        }

                        const pieceElement =
                            document.createElement("span");

                        pieceElement.textContent =
                            pieceName;

                        if (pieceName.length >= 2) {
                            pieceElement.classList.add("long-piece");
                        }

                        if (owner === "G") {
                            pieceElement.classList.add("gote");
                        }

                        square.appendChild(pieceElement);
                    }

                    boardElement.appendChild(square);
                }
            }
        }

        function selectHandPiece(kind, color) {
            // 問題回答済みなら何もしない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            // 成り選択待ちの場合は持ち駒を操作しない
            if (pendingBoardMove !== null) {
                return;
            }

            // 自分の手番ではない持ち駒は選択できない
            if (currentShogiBoard.turn !== color) {
                return;
            }

            // 盤上の駒を選択していたら解除
            selectedSquare = null;
            legalMoves = [];

            selectedHandPiece = {
                kind,
                color
            };
            legalDrops = shogiQuestion.getLegalDrops(
                currentShogiBoard,
                color
            );
            console.log(
                "持ち駒を選択:",
                selectedHandPiece
            );

            showHandsFromShogi();
            showBoardFromShogi();
        }
        function executeBoardDrop(handPiece, to) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            if (
                !legalDrops.some(drop => {
                    return (
                        drop.kind === handPiece.kind &&
                        drop.color === handPiece.color &&
                        drop.to.x === to.x &&
                        drop.to.y === to.y
                    );
                })
            ) {
                console.log("不合法な打ち場所です");
                return;
            }

            try {
                currentShogiBoard.drop(
                    to.x,
                    to.y,
                    handPiece.kind,
                    handPiece.color
                );

                const userMove = {
                    from_hand: true,
                    piece:
                        handPiece.color === ShogiJS.Color.Black
                            ? `S${shogiBoard.PIECE_NAME_MAP[handPiece.kind]}`
                            : `G${shogiBoard.PIECE_NAME_MAP[handPiece.kind]}`,
                    to
                };

                console.log(
                    "ユーザーの着手:",
                    userMove
                );

                const isCorrect =
                    shogiQuestion.isCorrectMove(
                        userMove,
                        questions[currentQuestion].move
                    );

                console.log("正解:", isCorrect);

                selectedHandPiece = null;
                legalDrops = [];

                handleBoardAnswer(
                    questions[currentQuestion],
                    isCorrect
                );

                showBoardFromShogi();
                showHandsFromShogi();

            } catch (error) {
                console.log(
                    "駒を打てません:",
                    error
                );
            }
        }
        function selectSquare(x, y) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }
            // 成り選択待ちの場合は盤面を操作しない
            if (pendingBoardMove !== null) {
                return;
            }

            // 持ち駒を選択している場合
            if (selectedHandPiece !== null) {
                const clickedPiece = currentShogiBoard.get(x, y);

                // 自分の駒をクリックした場合は、
                // 持ち駒の選択を解除して、その駒を新しく選択する
                if (
                    clickedPiece &&
                    clickedPiece.color === currentShogiBoard.turn
                ) {
                    selectedHandPiece = null;
                    legalDrops = [];

                    selectedSquare = { x, y };

                    legalMoves = shogiQuestion.getLegalMovesFrom(
                        currentShogiBoard,
                        selectedSquare
                    );

                    showHandsFromShogi();
                    showBoardFromShogi();

                    return;
                }

                // それ以外は持ち駒を打つ操作
                const to = {
                    x,
                    y
                };

                executeBoardDrop(
                    selectedHandPiece,
                    to
                );

                return;
            }

            const piece = currentShogiBoard.get(x, y);

            if (!selectedSquare) {
                if (
                    !shogiQuestion.canSelectPiece(
                        piece,
                        currentShogiBoard.turn,
                        ShogiJS
                    )
                ) {
                    return;
                }

                selectedSquare = { x, y };

                legalDrops = [];

                legalMoves = shogiQuestion.getLegalMovesFrom(
                    currentShogiBoard,
                    selectedSquare
                );

                showBoardFromShogi();
                return;
            }
            if (
                piece &&
                piece.color === currentShogiBoard.turn
            ) {
                selectedSquare = { x, y };

                legalMoves = [];

                legalMoves = shogiQuestion.getLegalMovesFrom(
                    currentShogiBoard,
                    selectedSquare
                );

                showBoardFromShogi();
                return;
            }
            if (selectedSquare.x === x && selectedSquare.y === y) {
                selectedSquare = null;
                legalMoves = [];

                showBoardFromShogi();
                return;
            }

            const from = {
                x: selectedSquare.x,
                y: selectedSquare.y
            };

            const to = {
                x,
                y
            };

            const isLegalDestination = legalMoves.some(move => {
                return move.to.x === x && move.to.y === y;
            });

            if (!isLegalDestination) {
                return;
            }

            if (
                shogiQuestion.isSuicideMove(currentShogiBoard, from, to, false) &&
                shogiQuestion.isSuicideMove(currentShogiBoard, from, to, true)
            ) {
                console.log("王を取られる手（自殺手）は指せません");
                selectedSquare = null;
                showBoardFromShogi();
                return;
            }

            const mustPromote =
                shogiQuestion.mustPromote(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    ShogiJS,
                    currentShogiBoard
                );

            const canPromote =
                shogiQuestion.canPromote(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    ShogiJS,
                    currentShogiBoard
                );

            if (mustPromote || canPromote) {
                pendingBoardMove = {
                    from,
                    to
                };

                selectedSquare = null;

                showPromotionChoice(mustPromote);

                return;
            }

            executeBoardMove(from, to, false);
        }
        
        function executeBoardMove(from, to, promote) {
            // 問題回答済みなら操作しない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            if (
                shogiQuestion.isSuicideMove(
                    currentShogiBoard,
                    from,
                    to,
                    promote
                )
            ) {
                console.log("王を取られる手（自殺手）は指せません");
                pendingBoardMove = null;
                selectedSquare = null;
                legalMoves = [];
                showBoardFromShogi();
                return;
            }

            try {
                currentShogiBoard.move(
                    from.x,
                    from.y,
                    to.x,
                    to.y,
                    promote
                );

                const userMove = {
                    from,
                    to,
                    promote
                };

                console.log(
                    "ユーザーの着手:",
                    userMove
                );

                const isCorrect =
                    shogiQuestion.isCorrectMove(
                        userMove,
                        questions[currentQuestion].move
                    );

                console.log("正解:", isCorrect);

                pendingBoardMove = null;
                selectedSquare = null;
                legalMoves = [];

                handleBoardAnswer(
                    questions[currentQuestion],
                    isCorrect
                );

                showBoardFromShogi();
                showHandsFromShogi();

            } catch (error) {
                console.log("駒を移動できません:", error);

                pendingBoardMove = null;
                selectedSquare = null;

                showBoardFromShogi();
            }
        }

        function showPromotionChoice(mustPromote) {
            const choicesElement =
                document.getElementById("choices");

            choicesElement.innerHTML = "";

            const promoteButton =
                document.createElement("button");

            promoteButton.textContent = "成る";

            promoteButton.onclick = function() {
                const move = pendingBoardMove;

                choicesElement.innerHTML = "";

                executeBoardMove(
                    move.from,
                    move.to,
                    true
                );
            };

            choicesElement.appendChild(promoteButton);

            if (mustPromote) {
                return;
            }

            const noPromoteButton =
                document.createElement("button");

            noPromoteButton.textContent = "成らない";

            noPromoteButton.onclick = function() {
                const move = pendingBoardMove;

                choicesElement.innerHTML = "";

                executeBoardMove(
                    move.from,
                    move.to,
                    false
                );
            };

            choicesElement.appendChild(noPromoteButton);
        }
        
        function checkAnswer(choice) {
            const question = questions[currentQuestion];

            // すでに回答済みなら何もしない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            const buttons =
                document.querySelectorAll("#choices button");

            if (choice === question.answer) {
                handleCorrectAnswer(question, buttons, choice);
            } else {
                handleIncorrectAnswer(question, buttons, choice);
            }

            finishQuestion(question, buttons);
        }

        function handleCorrectAnswer(question, buttons, choice) {
            correctCount++;

            buttons[choice].classList.add("correct");

            shogiBoard.executeCorrectMove(
                currentShogiBoard,
                question.move,
                ShogiJS
            );

            const isMate = shogiQuestion.isCheckmate(currentShogiBoard);
            document.getElementById("result").textContent =
                isMate ? "正解！（詰み）" : "正解！";

            showBoardFromShogi();
            showHandsFromShogi();
        }
        function handleIncorrectAnswer(question, buttons, choice) {
            document.getElementById("result").textContent =
                "不正解！";

            buttons[choice].classList.add("incorrect");
            buttons[question.answer].classList.add("correct");
        }
        function finishQuestion(question, buttons) {
            document.getElementById("explanation").textContent =
                question.explanation;

            buttons.forEach(button => {
                button.disabled = true;
            });

            document.getElementById("next-button").style.display =
                "block";
        }
        function handleBoardAnswer(question, isCorrect) {
            const buttons =
                document.querySelectorAll("#choices button");

            selectedSquare = null;
            selectedHandPiece = null;
            pendingBoardMove = null;
            legalMoves = [];
            legalDrops = [];

            if (isCorrect) {
                const isMate = shogiQuestion.isCheckmate(currentShogiBoard);
                document.getElementById("result").textContent =
                    isMate ? "正解！（詰み）" : "正解！";

                correctCount++;
            } else {
                document.getElementById("result").textContent =
                    "不正解！";
            }

            finishQuestion(question, buttons);

            showBoardFromShogi();
            showHandsFromShogi();
        }
        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        function saveHistory(rate) {
            const history =
                JSON.parse(
                    localStorage.getItem("shodanRoadHistory") || "[]"
                );

            history.push({
                date: new Date().toLocaleString("ja-JP"),
                correct: correctCount,
                total: questions.length,
                rate: rate
            });

            localStorage.setItem(
                "shodanRoadHistory",
                JSON.stringify(history)
            );

            return history;
        }
        function showBestRecord(history) {
            const bestRecord = history.reduce((best, record) => {
                return record.rate > best.rate ? record : best;
            });

            document.getElementById("best-record").textContent =
                `${bestRecord.correct} / ${bestRecord.total}問　${bestRecord.rate}%`;
        }
        function showHistory(history) {
            const historyList =
                document.getElementById("history-list");

            historyList.innerHTML = "";

            history.slice().reverse().forEach(record => {
                const p = document.createElement("p");

                p.textContent =
                    `${record.date}　${record.correct} / ${record.total}問　${record.rate}%`;

                historyList.appendChild(p);
            });

            document.getElementById("history").style.display =
                "block";
        }
        function showResult() {
            document.getElementById("question-number").textContent =
                "結果";

            document.getElementById("question").textContent =
                `${questions.length}問中${correctCount}問正解！`;

            document.getElementById("choices").innerHTML = "";

            const rate =
                Math.round(correctCount / questions.length * 100);

            document.getElementById("result").textContent =
                `正答率：${rate}%`;

            document.getElementById("explanation").textContent = "";

            document.getElementById("next-button").style.display =
                "none";
            document.getElementById("restart-button").style.display =
                "block";
            const history = saveHistory(rate);

            showBestRecord(history);

            // 履歴を表示
            showHistory(history);
        }
        function restartGame() {

            // 問題データを最初の状態に戻すためにページを再読み込み
            location.reload();
        }
    </script>
</body>
</html>
