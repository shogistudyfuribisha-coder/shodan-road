<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='shogi.js') }}"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LM9GCJ9CB6"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-LM9GCJ9CB6');
    </script>

    <title>初段への道</title>
</head>
<body>

    <h1>初段への道</h1>

    <div id="category-screen">
        <h2>カテゴリを選択</h2>

        <div id="category-buttons">
            <button onclick="startCategory('すべて')">すべて</button>
            <button onclick="startCategory('手筋')">手筋</button>
            <button onclick="startCategory('詰めろ・寄せ')">詰めろ・寄せ</button>
            <button onclick="startCategory('テスト')">テスト</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">

        <h2 id="question-number"></h2>

        <div id="gote-hand"></div>

        <div class="board-container">

            <div class="file-labels">
                <span>９</span>
                <span>８</span>
                <span>７</span>
                <span>６</span>
                <span>５</span>
                <span>４</span>
                <span>３</span>
                <span>２</span>
                <span>１</span>
            </div>

            <div class="board-with-ranks">
                <div class="board" id="board"></div>

                <div class="rank-labels">
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                    <span>七</span>
                    <span>八</span>
                    <span>九</span>
                </div>
            </div>

        </div>

        <div id="sente-hand"></div>

        <p id="question"></p>

        <div id="choices"></div>

        <p id="result"></p>
        <p id="explanation"></p>

        <button id="next-button" style="display: none;" onclick="nextQuestion()">
            次の問題
        </button>
        <button id="restart-button" style="display: none;" onclick="restartGame()">
            もう一度挑戦
        </button>
        <div id="history" style="display: none;">
            <h3>最高記録</h3>
            <p id="best-record"></p>

            <h3>これまでの記録</h3>
            <div id="history-list"></div>
        </div>
    </div>
    <script>
        console.log(ShogiJS);
        console.log(ShogiJS.Shogi);
        console.log(ShogiJS.Color);
        console.log(ShogiJS.Piece);
        const allQuestions = {{ questions | tojson }};

        const PIECE_KIND_MAP = {
            "歩": "FU",
            "香": "KY",
            "桂": "KE",
            "銀": "GI",
            "金": "KI",
            "角": "KA",
            "飛": "HI",
            "玉": "OU",
            "と": "TO",
            "成香": "NY",
            "成桂": "NK",
            "成銀": "NG",
            "馬": "UM",
            "龍": "RY"
        };

        const PIECE_NAME_MAP = {
            "FU": "歩",
            "KY": "香",
            "KE": "桂",
            "GI": "銀",
            "KI": "金",
            "KA": "角",
            "HI": "飛",
            "OU": "玉",
            "TO": "と",
            "NY": "成香",
            "NK": "成桂",
            "NG": "成銀",
            "UM": "馬",
            "RY": "龍"
        };

        let questions = [];
        function questionBoardToShogi(row, col) {
            return {
                x: 9 - col,
                y: row + 1
            };
        }
        function shogiToQuestionBoard(x, y) {
            return {
                row: y - 1,
                col: 9 - x
            };
        }
        function startCategory(category) {
            if (category === "すべて") {
                questions = [...allQuestions];
            } else {
                questions = allQuestions.filter(
                    question => question.category === category
                );
            }

            // 問題をランダムな順番に並べる
            // questions.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            correctCount = 0;

            document.getElementById("category-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            showQuestion();
        }

        let currentQuestion = 0;
        let correctCount = 0;

        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");

        if (category === "手筋" || category === "詰めろ・寄せ" || category === "すべて") {
            startCategory(category);
        }

        function showQuestion() {
            const question = questions[currentQuestion];

            currentShogiBoard =
                createShogiBoard(question);

            document.getElementById("question-number").textContent =
                `第${currentQuestion + 1}問 / 全${questions.length}問`;

            showBoard(question.board);
            showHandsFromShogi();

            document.getElementById("question").textContent =
                question.question;

            showChoices(question);

            document.getElementById("result").textContent = "";
            document.getElementById("explanation").textContent = "";
            document.getElementById("next-button").style.display = "none";
        }

        function showChoices(question) {
            const choicesElement =
                document.getElementById("choices");

            choicesElement.innerHTML = "";

            question.choices.forEach((choice, index) => {
                const button =
                    document.createElement("button");

                button.textContent = choice;

                button.onclick = function() {
                    checkAnswer(index);
                };

                choicesElement.appendChild(button);
            });
        }
        function showHandsFromShogi() {

            const senteHand = currentShogiBoard.hands[ShogiJS.Color.Black]
                .map(piece => PIECE_NAME_MAP[piece.kind]);

            const goteHand = currentShogiBoard.hands[ShogiJS.Color.White]
                .map(piece => PIECE_NAME_MAP[piece.kind]);

            document.getElementById("sente-hand").textContent =
                `先手の持ち駒：${senteHand.join("、") || "なし"}`;

            document.getElementById("gote-hand").textContent =
                `後手の持ち駒：${goteHand.join("、") || "なし"}`;
        }

        function createShogiBoard(question) {
            const board = new ShogiJS.Shogi();

            board.editMode(true);

            clearShogiBoard(board);
            setupBoardPieces(board, question);
            setupHands(board, question);
            setupTurn(board, question);

            board.editMode(false);

            return board;
        }

        function clearShogiBoard(board) {
            for (let y = 1; y <= 9; y++) {
                for (let x = 1; x <= 9; x++) {
                    board.set(x, y, null);
                }
            }
        }
        function setupBoardPieces(board, question) {
            question.board.forEach((row, rowIndex) => {
                row.forEach((piece, colIndex) => {
                    if (!piece) {
                        return;
                    }

                    const owner = piece.charAt(0);
                    const pieceName = piece.slice(1);
                    const kind = PIECE_KIND_MAP[pieceName];

                    if (!kind) {
                        throw new Error(`未対応の駒: ${pieceName}`);
                    }

                    const { x, y } =
                        questionBoardToShogi(rowIndex, colIndex);

                    const csa =
                        owner === "S"
                            ? `+${kind}`
                            : `-${kind}`;

                    board.set(
                        x,
                        y,
                        new ShogiJS.Piece(csa)
                    );
                });
            });
        }

        function setupHands(board, question) {
            setupHand(
                board,
                question.hand.先手,
                ShogiJS.Color.Black
            );

            setupHand(
                board,
                question.hand.後手,
                ShogiJS.Color.White
            );
        }

        function setupHand(board, pieces, color) {
            pieces.forEach(pieceName => {
                const kind = PIECE_KIND_MAP[pieceName];

                if (!kind) {
                    throw new Error(`未対応の持ち駒: ${pieceName}`);
                }

                const csa =
                    color === ShogiJS.Color.Black
                        ? `+${kind}`
                        : `-${kind}`;

                board.pushToHand(
                    new ShogiJS.Piece(csa)
                );
            });
        }

        function setupTurn(board, question) {
            const move = question.move;

            if (move.from_hand) {
                const owner = move.piece.charAt(0);

                board.setTurn(
                    owner === "S"
                        ? ShogiJS.Color.Black
                        : ShogiJS.Color.White
                );

                return;
            }

            const [file, rank] = move.from;

            const { row, col } =
                shogiToQuestionBoard(file, rank);

            const piece = question.board[row][col];

            if (!piece) {
                throw new Error(
                    `移動元に駒がありません: ${file}${rank}`
                );
            }

            const owner = piece.charAt(0);

            board.setTurn(
                owner === "S"
                    ? ShogiJS.Color.Black
                    : ShogiJS.Color.White
            );
        }

        function syncBoardFromShogi(question) {

            // question.board をすべて空にする
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    question.board[row][col] = "";
                }
            }

            // shogi.js の盤面を question.board にコピー
            for (let y = 1; y <= 9; y++) {
                for (let x = 1; x <= 9; x++) {
                    const piece = currentShogiBoard.get(x, y);

                    if (piece === null) {
                        continue;
                    }

                    const owner =
                        piece.color === ShogiJS.Color.Black
                            ? "S"
                            : "G";

                    const pieceName = PIECE_NAME_MAP[piece.kind];

                    if (!pieceName) {
                        throw new Error(`未対応の駒: ${piece.kind}`);
                    }

                    // shogi.js → question.board
                    const row = y - 1;
                    const col = 9 - x;

                    question.board[row][col] =
                        owner + pieceName;
                }
            }
        }

        function showBoard(board) {
            const boardElement = document.getElementById("board");
            boardElement.innerHTML = "";

            board.forEach(row => {
                row.forEach(piece => {
                    const square = document.createElement("div");

                    square.className = "square";

                    if (piece !== "") {
                        const owner = piece.charAt(0);
                        const pieceName = piece.slice(1);

                        const pieceElement = document.createElement("span");
                        pieceElement.textContent = pieceName;

                        if (owner === "G") {
                            pieceElement.classList.add("gote");
                        }

                        square.appendChild(pieceElement);
                    }

                    boardElement.appendChild(square);
                });
            });
        }

        function executeCorrectMove(move) {
            if (move.from_hand) {
                dropPiece(move);
            } else {
                movePiece(move);
            }
        }

        function dropPiece(move) {
            const [file, rank] = move.to;

            const pieceName = move.piece.slice(1);
            const kind = PIECE_KIND_MAP[pieceName];

            if (!kind) {
                throw new Error(
                    `未対応の駒: ${pieceName}`
                );
            }

            const color =
                move.piece.charAt(0) === "S"
                    ? ShogiJS.Color.Black
                    : ShogiJS.Color.White;

            currentShogiBoard.drop(
                file,
                rank,
                kind,
                color
            );
        }

        function movePiece(move) {
            const [fromFile, fromRank] = move.from;
            const [toFile, toRank] = move.to;

            currentShogiBoard.move(
                fromFile,
                fromRank,
                toFile,
                toRank,
                move.promote || false
            );
        }

        function checkAnswer(choice) {
            const question = questions[currentQuestion];

            // すでに回答済みなら何もしない
            if (
                document.getElementById("next-button").style.display === "block"
            ) {
                return;
            }

            const buttons =
                document.querySelectorAll("#choices button");

            if (choice === question.answer) {
                document.getElementById("result").textContent =
                    "正解！";

                correctCount++;

                buttons[choice].classList.add("correct");

                // 正解手を実行
                executeCorrectMove(question.move);

                // shogi.js の状態を画面に反映
                syncBoardFromShogi(question);
                showBoard(question.board);
                showHandsFromShogi();

            } else {
                document.getElementById("result").textContent =
                    "不正解！";

                buttons[choice].classList.add("incorrect");
                buttons[question.answer].classList.add("correct");
            }

            document.getElementById("explanation").textContent =
                question.explanation;

            buttons.forEach(button => {
                button.disabled = true;
            });

            document.getElementById("next-button").style.display =
                "block";
        }
        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                document.getElementById("question-number").textContent =
                    "結果";

                document.getElementById("question").textContent =
                    `${questions.length}問中${correctCount}問正解！`;

                document.getElementById("choices").innerHTML = "";

                document.getElementById("result").textContent =
                    `正答率：${Math.round(correctCount / questions.length * 100)}%`;

                document.getElementById("explanation").textContent = "";

                document.getElementById("next-button").style.display = "none";
                // プレイ結果を履歴に保存
                const history = JSON.parse(localStorage.getItem("shodanRoadHistory") || "[]");

                history.push({
                    date: new Date().toLocaleString("ja-JP"),
                    correct: correctCount,
                    total: questions.length,
                    rate: Math.round(correctCount / questions.length * 100)
                });

                localStorage.setItem("shodanRoadHistory", JSON.stringify(history));
                // 最高記録を表示
                const bestRecord = history.reduce((best, record) => {
                    return record.rate > best.rate ? record : best;
                });

                document.getElementById("best-record").textContent =
                    `${bestRecord.correct} / ${bestRecord.total}問　${bestRecord.rate}%`;

                // 履歴を表示
                const historyList = document.getElementById("history-list");
                historyList.innerHTML = "";

                history.slice().reverse().forEach(record => {
                    const p = document.createElement("p");
                    p.textContent =
                        `${record.date}　${record.correct} / ${record.total}問　${record.rate}%`;
                    historyList.appendChild(p);
                });

                document.getElementById("history").style.display = "block";
                document.getElementById("restart-button").style.display = "block";
            }
        }

        function restartGame() {
            currentQuestion = 0;
            correctCount = 0;

            // 問題データを最初の状態に戻すためにページを再読み込み
            location.reload();
        }
    </script>
</body>
</html>
